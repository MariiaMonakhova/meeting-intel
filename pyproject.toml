[project]
name = "meeting-intel"
version = "0.1.0"
description = "AI-powered meeting intelligence: MapReduce extraction, RAG, structured outputs, eval"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
meeting-intel = "meetingintel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meetingintel*"]
